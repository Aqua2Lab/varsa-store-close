<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightly Store Close</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f3f5f8;margin:0;padding:16px;color:#1f2933}
.card{max-width:560px;margin:auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px #0001}
h1{font-size:1.3rem;margin:0 0 4px}p.sub{margin:0 0 12px;color:#667}h2{font-size:1rem;margin:22px 0 4px;color:#0b5cad;border-bottom:1px solid #dde;padding-bottom:4px}
label{display:block;font-weight:600;margin:12px 0 4px}small{font-weight:400;color:#778}
input,select{width:100%;box-sizing:border-box;padding:12px;font-size:1rem;border:1px solid #ccd;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.err{color:#c0392b;font-size:.85rem;min-height:1em}
button{width:100%;margin-top:14px;padding:14px;font-size:1.05rem;border:0;border-radius:8px;background:#0b5cad;color:#fff;font-weight:700}
button.sec{background:#e8eef6;color:#0b5cad}
#done{display:none;margin-top:14px;padding:10px;background:#e6f6ec;border-radius:8px}
</style></head><body><div class="card">
<h1>Nightly Store Close</h1><p class="sub">Varsa GROUP LLC – fill from the Ruby2 Store Close report</p>
<form id="f" novalidate>
<label>Store name</label><select id="store" required><option value="">Select store</option><option>Thomasville Chevron</option><option>Thomasville Outrun</option></select><div class="err"></div>
<div class="grid"><div><label>Date</label><input type="date" id="date" required><div class="err"></div></div>
<div><label>Cashier</label><input id="cashier" required><div class="err"></div></div></div>

<h2>Fuel</h2>
<label>Total Fuel Sales</label><input type="number" step="0.01" min="0" id="fuel" required><div class="err"></div>
<label>Fuel Discounts <small>(enter as positive, e.g. 13.83)</small></label><input type="number" step="0.01" min="0" id="disc" required><div class="err"></div>

<h2>Departments <small>(Net Sales column)</small></h2>
<div class="grid" id="own"></div>
<h2>Grocery group</h2>
<div class="grid" id="groc"></div>

<h2>Totals</h2>
<label>Sales Tax <small>(Total Taxes Collected)</small></label><input type="number" step="0.01" min="0" id="tax" required><div class="err"></div>
<label>Total Sales <small>(from report)</small></label><input type="number" step="0.01" min="0" id="total" required><div class="err"></div>
<label>Credit/Debit Card Sales <small>(Network Revenue = Ruby C/C)</small></label><input type="number" step="0.01" min="0" id="card" required><div class="err"></div>
<h2>Outgoing</h2>
<label>Bank Deposit <small>(cash counted minus the $300 left in the drawer)</small></label><input type="number" step="0.01" min="0" id="dep" required><div class="err"></div>
<div class="grid"><div><label>FD130</label><input type="number" step="0.01" min="0" id="fd130"><div class="err"></div></div>
<div><label>Coupons</label><input type="number" step="0.01" min="0" id="coup"><div class="err"></div></div>
<div><label>Cash Purchases</label><input type="number" step="0.01" min="0" id="cpur"><div class="err"></div></div>
<div><label>Cash Expenses</label><input type="number" step="0.01" min="0" id="cexp"><div class="err"></div></div></div>
<button type="submit">Submit</button></form>
<div id="done"></div><p class="sub" id="cnt"></p></div>
<script>
const OWN=['Beer','Cigarettes','Novelty','Oil','Tobacco','Vape'],GROC=['Candy','Chips','Deli','Dept 1','Drinks','Grocery','Ice','TBA'];
const key=n=>'d_'+n.replace(/\W/g,'');
function mk(list,box){list.forEach(n=>{box.insertAdjacentHTML('beforeend',`<div><label>${n}</label><input type="number" step="0.01" id="${key(n)}" class="dep"><div class="err"></div></div>`)})}
mk(OWN,document.getElementById('own'));mk(GROC,document.getElementById('groc'));
const $=id=>document.getElementById(id),v=id=>parseFloat($(id).value)||0,m=n=>(Math.round(n*100)/100).toFixed(2);
$('date').valueAsDate=new Date();
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbx5ZSpU9HmyvhfSYle0_KzkfeXcTETkwNpP2JzNaXJU4pLSQqXeIFD-jDN1DOo7R9TX/exec';
const log=()=>JSON.parse(localStorage.getItem('closeLog')||'[]');
function count(){$('cnt').textContent=log().length+' submission(s) sent from this device.'}count();
document.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',()=>{const e=i.nextElementSibling;if(e&&e.classList.contains('err'))e.textContent=''}));
$('f').addEventListener('submit',e=>{e.preventDefault();let ok=true;
 document.querySelectorAll('[required]').forEach(i=>{const er=i.nextElementSibling;if(!i.value.trim()){er.textContent='Required';ok=false}else if(i.type=='number'&&v(i.id)<0){er.textContent='Must be 0 or more';ok=false}});
 if(v('disc')>v('fuel')){$('disc').nextElementSibling.textContent='Discount cannot exceed fuel sales';ok=false}
 if(!ok){window.scrollTo(0,0);return}
const r={date:$('date').value,store_name:$('store').value,fuel_sales:m(v('fuel')),fuel_discounts:m(v('disc')),sales_tax:m(v('tax')),total_sales:m(v('total')),card_sales:m(v('card')),bank_deposit:m(v('dep')),fd130:m(v('fd130')),coupons:m(v('coup')),cash_purchases:m(v('cpur')),cash_expenses:m(v('cexp')),cashier:$('cashier').value,grocery_total:$('grocTot').value};
 [...OWN,...GROC].forEach(n=>r[n.toLowerCase().replace(/\W+/g,'_')]=m(v(key(n))));
 const btn=document.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Sending...';
 fetch(WEBAPP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(r)})
 .then(()=>{$('done').style.display='block';$('done').style.background='#e6f6ec';$('done').textContent='Submitted to the Store Close Log sheet. Thank you!';
  const all=log();all.push(r);localStorage.setItem('closeLog',JSON.stringify(all));count();
  document.querySelectorAll('.dep,#fuel,#disc,#tax,#total,#card,#dep,#fd130,#coup,#cpur,#cexp').forEach(i=>i.value='');})
 .catch(()=>{$('done').style.display='block';$('done').style.background='#fdecea';$('done').textContent='Could not send - check internet and submit again.';})
 .finally(()=>{btn.disabled=false;btn.textContent='Submit';});});
</script></body></html>
