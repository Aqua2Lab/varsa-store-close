<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Varsa Group</title>
<style>
:root{--navy:#1F2A44;--ink:#1F2A44;--muted:#5c6773;--line:#d5dbe3;--bg:#f3f5f7;--card:#fff;--chip:#e7ebf0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:20px 18px 18px}
.brand{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:650}
.hero h1{margin:6px 0 4px;font-size:1.7rem;line-height:1.15}
.hero p{margin:0;font-size:.95rem;line-height:1.4;opacity:.92}
.bar{position:sticky;top:0;z-index:3;background:var(--bg);margin:0 -14px;padding:12px 14px 8px}
.search{width:100%;font:inherit;font-size:1.05rem;padding:14px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.search:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px #1F2A4422}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;font:inherit;font-size:.92rem;font-weight:650;color:var(--navy);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px}
.chips button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.jumps{display:flex;gap:8px;overflow:auto;padding:4px 0 2px;scrollbar-width:none}
.jumps::-webkit-scrollbar{display:none}
.jumps a{flex:0 0 auto;color:var(--navy);background:#fff;border:1px solid var(--line);text-decoration:none;border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:650}
.count{margin:8px 2px 0;color:var(--muted);font-size:.88rem}
.section{margin-top:18px;scroll-margin-top:248px}
.section h2{margin:0 0 8px;font-size:1.05rem;color:var(--navy)}
.group{margin:8px 0 4px;font-size:.82rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit}
.card:active{background:#eef1f5}
.card:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.ic{width:40px;height:40px;border-radius:12px;background:#e7ebf0;color:var(--navy);display:grid;place-items:center}
.ic svg{width:22px;height:22px;display:block}
.card b{display:block;font-size:1rem;line-height:1.25}
.card small{display:block;margin-top:2px;color:var(--muted);font-size:.86rem;font-weight:500;line-height:1.35}
.badge{display:inline-block;margin-top:8px;font-size:.68rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);background:#e7ebf0;border-radius:999px;padding:5px 8px}
.empty{padding:18px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:16px}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px}
@media(min-width:800px){
  .hero h1{font-size:2rem}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<p class="brand">Varsa Group</p>
<h1>Varsa Group</h1>
<p>Thomasville Chevron and Thomasville Outrun. Apps, sheets, forms, docs, and folders in one place.</p>
</header>
<div class="bar">
<label class="visually-hidden" for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search links</label>
<input class="search" id="q" type="search" placeholder="Search by name or description" autocomplete="off" enterkeyhint="search">
<div class="chips" id="roles" role="group" aria-label="Who it is for">
<button type="button" data-role="all" aria-pressed="true">All</button>
<button type="button" data-role="manager" aria-pressed="false">Managers</button>
<button type="button" data-role="cashier" aria-pressed="false">Cashiers</button>
</div>
<div class="chips" id="types" role="group" aria-label="Kind of link">
<button type="button" data-type="" aria-pressed="true">All types</button>
<button type="button" data-type="App" aria-pressed="false">App</button>
<button type="button" data-type="Sheet" aria-pressed="false">Sheet</button>
<button type="button" data-type="Form" aria-pressed="false">Form</button>
<button type="button" data-type="Doc" aria-pressed="false">Doc</button>
<button type="button" data-type="Folder" aria-pressed="false">Folder</button>
<button type="button" data-type="Repo" aria-pressed="false">Repo</button>
</div>
<nav class="jumps" id="jumps" aria-label="Categories"></nav>
<p class="count" id="count"></p>
</div>
<main id="list"></main>
<p class="foot">Varsa Group · Thomasville Chevron &amp; Thomasville Outrun</p>
</div>
<script src="links.js"></script>
<script>
const ICONS = {
  App: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 18.5h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  Sheet: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 9h16M4 14h16M10 3.5v17" stroke="currentColor" stroke-width="1.6"/></svg>',
  Form: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  Doc: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-10.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14 3.5V9h5.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  Folder: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5H10l2 2h6.5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-10z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  Repo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 6l-2 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const ROLE_LABEL = { manager: "Managers", cashier: "Cashiers", both: "Everyone" };
const state = { q: "", role: "all", type: "" };
const $ = id => document.getElementById(id);

function matches(item) {
  if (state.role !== "all" && item.role !== state.role && item.role !== "both") return false;
  if (state.type && item.type !== state.type) return false;
  if (!state.q) return true;
  const hay = (item.name + " " + item.description + " " + item.category + " " + item.type).toLowerCase();
  return hay.includes(state.q);
}

function card(item) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = item.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  const ic = document.createElement("span");
  ic.className = "ic";
  ic.innerHTML = ICONS[item.type] || "";
  const text = document.createElement("span");
  const name = document.createElement("b");
  name.textContent = item.name;
  const desc = document.createElement("small");
  desc.textContent = item.description;
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = item.type;
  text.append(name, desc, badge);
  a.append(ic, text);
  return a;
}

function render() {
  const shown = VARSA_LINKS.filter(matches);
  const list = $("list");
  list.replaceChildren();
  if (!shown.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Nothing matches that search.";
    list.append(p);
  } else {
    VARSA_CATEGORIES.forEach(cat => {
      const rows = shown.filter(item => item.category === cat.name);
      if (!rows.length) return;
      const section = document.createElement("section");
      section.className = "section";
      section.id = cat.id;
      const h2 = document.createElement("h2");
      h2.textContent = cat.name;
      section.append(h2);
      if (cat.id === "daily") {
        ["manager", "cashier"].forEach(role => {
          const groupRows = rows.filter(item => item.role === role);
          if (!groupRows.length) return;
          const h3 = document.createElement("h3");
          h3.className = "group";
          h3.textContent = ROLE_LABEL[role];
          const box = document.createElement("div");
          box.className = "cards";
          groupRows.forEach(item => box.append(card(item)));
          section.append(h3, box);
        });
      } else {
        const box = document.createElement("div");
        box.className = "cards";
        rows.forEach(item => box.append(card(item)));
        section.append(box);
      }
      list.append(section);
    });
  }
  $("count").textContent = shown.length + " of " + VARSA_LINKS.length + " links";
  document.querySelectorAll("#jumps a").forEach(a => {
    const id = a.getAttribute("href").slice(1);
    const visible = shown.some(item => VARSA_CATEGORIES.find(c => c.id === id && c.name === item.category));
    a.hidden = !visible;
  });
}

function press(group, attr, value) {
  group.querySelectorAll("button").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset[attr] === value || (attr === "type" && !value && !btn.dataset.type))));
}

$("roles").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.role = btn.dataset.role;
  press($("roles"), "role", state.role);
  render();
});
$("types").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.type = btn.dataset.type || "";
  $("types").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.type || "") === state.type)));
  render();
});
$("q").addEventListener("input", () => { state.q = $("q").value.trim().toLowerCase(); render(); });

const jumps = $("jumps");
VARSA_CATEGORIES.forEach(cat => {
  const a = document.createElement("a");
  a.href = "#" + cat.id;
  a.textContent = cat.name.replace(" & ", " & ").replace("Vendors, Invoices & Payments", "Vendors").replace("Inventory & Supplies", "Inventory").replace("Scheduling & Time", "Schedule").replace("Onboarding & HR", "HR").replace("Daily Store Ops", "Store ops").replace("Drive Folders", "Drive");
  jumps.append(a);
});
render();
</script>
</body>
</html>
